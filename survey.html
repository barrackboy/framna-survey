document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n\n<script src=\"e95deee7-9956-47f8-be72-c31f372e82ce\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n@font-face { font-family: 'Framna Serif'; font-weight: 700; src: url(\"a4c79b8e-d832-48d7-891a-aa81d0d5330c\") format('truetype'); font-display: swap; }\n@font-face { font-family: 'Framna Sans'; font-weight: 400; src: url(\"0e3cc535-c45c-4bac-8a29-c96797ead83a\") format('truetype'); font-display: swap; }\n@font-face { font-family: 'Framna Sans'; font-weight: 700; src: url(\"dc4a2cf0-b871-444f-9909-1a03647e2964\") format('truetype'); font-display: swap; }\nbody { margin: 0; background: #E4EFF1; color: #0A0A0A; font-family: 'Framna Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\na { color: #0A0A0A; text-decoration: underline; text-underline-offset: 0.18em; text-decoration-thickness: 1px; }\na:hover { color: #0FB354; }\n@keyframes steam-rise { 0% { opacity: 0.15; } 50% { opacity: 1; } 100% { opacity: 0.15; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(28px, 5vw, 48px) clamp(16px, 4vw, 32px) clamp(56px, 8vw, 96px)\">\n  <div style=\"max-width: 780px; margin-bottom: clamp(28px, 7vw, 40px); background: #1CCE70; border-radius: 20px; padding: 14px 18px; display: flex; gap: 14px; align-items: center\">\n    {{ cupIcon }}\n    <div style=\"display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0\">\n      <div style=\"font-size: clamp(15px, 4vw, 16px); font-weight: 700; line-height: 1.3; color: #0A0A0A; text-wrap: pretty\">This is your free barista coffee ticket<\u002Fdiv>\n      <div style=\"font-size: clamp(13px, 3.5vw, 14px); line-height: 1.4; color: #0A0A0A; text-wrap: pretty\">Show it at the <strong>Framna booth<\u002Fstrong>. Screenshot it so you don't lose it.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width: 780px\">\n    <h1 style=\"font-family: 'Framna Serif', Georgia, serif; font-weight: 700; font-size: clamp(30px, 7.5vw, 72px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 16px; text-wrap: pretty\">The leap to intelligent products: AI in product work<\u002Fh1>\n  <\u002Fdiv>\n  <sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"4\">\n    <div style=\"margin-top: clamp(64px, 14vw, 90px)\">\n      <div style=\"display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid rgba(10,10,10,0.12); padding-bottom: 16px; margin-bottom: clamp(20px, 4vw, 30px)\">\n        <div style=\"font-size: 14px; color: #5C636B; font-variant-numeric: tabular-nums\">{{ sec.num }}<\u002Fdiv>\n        <h2 style=\"font-family: 'Framna Serif', Georgia, serif; font-weight: 700; font-size: clamp(22px, 5.2vw, 34px); line-height: 1.1; letter-spacing: -0.01em; margin: 0; text-wrap: pretty\">{{ sec.title }}<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 100%), 1fr)); gap: clamp(16px, 3vw, 24px); align-items: start\">\n        <sc-for list=\"{{ sec.questions }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div style=\"background: #F4F7F8; border-radius: clamp(24px, 5vw, 32px); padding: clamp(20px, 5vw, 32px); display: flex; flex-direction: column; gap: 20px\">\n            <sc-if value=\"{{ q.avg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex\">\n                <span style=\"display: inline-flex; padding: 6px 14px; border-radius: 999px; background: #0A0A0A; color: #FFFFFF; font-size: 13px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums\">Avg&nbsp;{{ q.avg }}&nbsp;/&nbsp;5<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"font-family: 'Framna Serif', Georgia, serif; font-weight: 700; font-size: clamp(21px, 5vw, 24px); line-height: 1.15; letter-spacing: -0.01em; text-wrap: pretty\">{{ q.title }}<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 14px\">\n              <sc-for list=\"{{ q.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                  <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; line-height: 1.3\">\n                    <span style=\"color: #0A0A0A; font-weight: {{ o.weight }}\">{{ o.label }}<\u002Fspan>\n                    <span style=\"color: #5C636B; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: {{ o.weight }}\">{{ o.value }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"height: 12px; border-radius: 999px; background: rgba(10,10,10,0.07); overflow: hidden\">\n                    <div style=\"height: 100%; border-radius: 999px; background: {{ o.fill }}; width: {{ o.w }}%; transition: width 360ms cubic-bezier(0.2, 0.8, 0.2, 1)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ q.note }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size: 13px; color: #5C636B; line-height: 1.4\">{{ q.note }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;showCounts&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Charts&quot; },\n  &quot;hideEmpty&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Charts&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { rows: null, role: 'all' };\n\n  cupRef = React.createRef();\n\n  componentDidMount() {\n    this.wordmark = new Image();\n    this.wordmark.src = (window.__resources && window.__resources.wordmark) || 'assets/framna-wordmark-clean.png';\n    const tick = (t) => { this.drawCup(t); this._raf = requestAnimationFrame(tick); };\n    this._raf = requestAnimationFrame(tick);\n    fetch((window.__resources && window.__resources.surveyCsv) || 'uploads/framna_survey_responses_example - Responses (3).csv')\n      .then(r => r.text())\n      .then(t => this.setState({ rows: this.parseCSV(t) }))\n      .catch(() => this.setState({ rows: [] }));\n  }\n\n  componentWillUnmount() { cancelAnimationFrame(this._raf); }\n\n  drawCup(t) {\n    const cv = this.cupRef.current;\n    if (!cv) return;\n    const ctx = cv.getContext('2d');\n    const S = cv.width / 24;\n    ctx.clearRect(0, 0, cv.width, cv.height);\n    ctx.save();\n    ctx.scale(S, S);\n    ctx.strokeStyle = '#0A0A0A';\n    ctx.lineWidth = 1.05;\n    ctx.lineCap = 'round';\n    ctx.lineJoin = 'round';\n    const lid = new Path2D('M7 4.6c3.3-.4 6.7-.4 10 0l.5 2c-3.6-.5-7.4-.5-11 0Z');\n    const body = new Path2D('M6.7 6.8l1.4 12.5c.1.8.8 1.5 1.6 1.5h4.6c.8 0 1.5-.7 1.6-1.5l1.4-12.5');\n    const bodyClosed = new Path2D('M6.7 6.8l1.4 12.5c.1.8.8 1.5 1.6 1.5h4.6c.8 0 1.5-.7 1.6-1.5l1.4-12.5Z');\n    ['M8.7 2.4c-.4-.7.3-1.1.1-1.9', 'M12 2.5c-.4-.8.3-1.2.1-2.1', 'M15.2 2.4c-.4-.7.3-1.1.1-1.9'].forEach(d => ctx.stroke(new Path2D(d)));\n    // cylindrical print\n    const img = this.wordmark;\n    if (img && img.complete && img.naturalWidth) {\n      ctx.save();\n      ctx.clip(bodyClosed);\n      const cx = 12, R = 5.1, textLen = 19, period = 25, yTop = 9.6, hW = 6.4;\n      const off = (t / 1000 * 2.2) % period;\n      const texPerWorld = img.width / textLen;\n      for (let px = Math.ceil((cx - R) * S); px <= Math.floor((cx + R) * S); px++) {\n        const xw = px / S;\n        const s = Math.max(-1, Math.min(1, (xw - cx) / R));\n        const theta = Math.asin(s);\n        let u = (theta * R + off) % period;\n        if (u < 0) u += period;\n        if (u >= textLen) continue;\n        ctx.globalAlpha = Math.pow(Math.cos(theta), 0.75);\n        const sw = Math.max(1, texPerWorld * Math.cos(theta) / S);\n        ctx.drawImage(img, u * texPerWorld, 0, sw, img.height, xw, yTop, 1 / S, hW);\n      }\n      ctx.restore();\n    }\n    ctx.stroke(lid);\n    ctx.stroke(body);\n    ctx.restore();\n  }\n\n  parseCSV(text) {\n    const rows = []; let row = [], field = '', inQ = false;\n    for (let i = 0; i < text.length; i++) {\n      const c = text[i];\n      if (inQ) {\n        if (c === '\"') { if (text[i + 1] === '\"') { field += '\"'; i++; } else inQ = false; }\n        else field += c;\n      } else if (c === '\"') inQ = true;\n      else if (c === ',') { row.push(field); field = ''; }\n      else if (c === '\\n' || c === '\\r') {\n        if (field !== '' || row.length) { row.push(field); rows.push(row); row = []; field = ''; }\n      } else field += c;\n    }\n    if (field !== '' || row.length) { row.push(field); rows.push(row); }\n    const header = rows.shift();\n    return rows.filter(r => r.length > 1).map(r => {\n      const o = {}; header.forEach((h, i) => { o[h] = (r[i] || '').trim(); }); return o;\n    });\n  }\n\n  clean(v, isRole) {\n    v = (v || '').replace(/&#xa0;|&nbsp;/g, ' ').replace(/<[^>]+>/g, '').trim();\n    const m = v.match(/^([^:]{2,40}):/);\n    if (m) v = m[1].trim();\n    if (isRole) v = v.replace(/\\s*\\([^)]*\\)\\s*$/, '');\n    return v;\n  }\n\n  defs() {\n    const L = {\n      role: { 'Product leadership': 'Product leadership', 'Product design': 'Product design', 'Product engineering': 'Product engineering', 'Technology leadership': 'Technology leadership', 'Executive leadership': 'Executive leadership', 'Other': 'Other' },\n      size: { 'Under 50': 'Under 50 people', '50\\u2013250': '50\\u2013250', '250\\u20131,000': '250\\u20131,000', '1,000\\u20135,000': '1,000\\u20135,000', '5,000+': '5,000+' },\n      progress: { 'Not yet': 'Not yet started', 'In progress': 'In progress', 'Largely done': 'Largely done' },\n      budget: { 'Growing, because we can now build more': 'Growing \\u2014 we can now build more', 'Flat, and expectations are unchanged': 'Flat \\u2014 expectations unchanged', 'Flat, but we expect more for the same money': 'Flat \\u2014 but more is expected', 'Shrinking, because AI should make it cheaper': 'Shrinking \\u2014 AI should make it cheaper', 'Too early to say': 'Too early to say' },\n      features: { 'Conversational input': 'Conversational input', 'Personalized experience': 'Personalized experiences', 'Adaptive interface': 'Adaptive interface', 'Insights and guidance': 'Insights and guidance', 'Agentic execution': 'Agentic execution', 'Content generation': 'Content generation', 'Open to external agents': 'Open to external agents' },\n      authorship: { 'A person writes the code': 'Human-written', 'With AI assistance': 'AI-assisted', 'Mixed': 'Mixed', 'Agent-first': 'Agent-first' },\n      quality: { 'Better': 'Better', 'About the same': 'About the same', 'Worse': 'Worse', \"Don't know\": \"Don't know\" },\n      volume: { 'Significantly less': 'Significantly less', 'Somewhat less': 'Somewhat less', 'About the same': 'About the same', 'Somewhat more': 'Somewhat more', 'Significantly more': 'Significantly more', \"Don't know\": \"Don't know\" },\n      idea: { 'Days': 'Days', 'A few weeks': 'A few weeks', 'A month or two': 'A month or two', 'A quarter or more': 'A quarter or more', 'It varies': 'It varies' },\n      speed: { 'Much faster': 'Much faster', 'Faster': 'Faster', 'About the same': 'About the same', 'Slower': 'Slower', 'Much slower': 'Much slower', \"Don't know\": \"Don't know\" },\n      bottleneck: { 'Data readiness': 'Data readiness', 'Unclear value': 'Unclear value', 'Skills and capacity': 'Skills and capacity', 'Risk and compliance': 'Risk and compliance', 'Legacy systems': 'Legacy systems', 'Speed of decision-making': 'Speed of decision-making', 'Culture': 'Culture' }\n    };\n    return [\n      { num: '01', title: 'Who answered', questions: [\n        { code: 'Q1', col: 'fpd26_q01_role', title: 'What best describes your role?', type: 'single', labels: L.role, sort: true, role: true },\n        { code: 'Q2', col: 'fpd26_q02_company_size', title: 'How large is your company?', type: 'single', labels: L.size }\n      ] },\n      { num: '02', title: 'Expectations and strategy', questions: [\n        { code: 'Q3', col: 'fpd26_q03_expectations_raised', title: 'AI has raised what users expect from our product', type: 'scale', low: 'Not at all', high: 'Dramatically' },\n        { code: 'Q4', col: 'fpd26_q04_product_adapted', title: 'Our product has already adapted to AI', type: 'scale', low: 'Not at all', high: 'Completely' },\n        { code: 'Q5', col: 'fpd26_q05_strategy_rethink', title: 'AI is making us rethink our product strategy', type: 'scale', low: 'Not at all', high: 'From the ground up' },\n        { code: 'Q6', col: 'fpd26_q06_rethink_progress', title: 'How far along is that rethink?', type: 'single', labels: L.progress, canonical: true },\n        { code: 'Q19', col: 'fpd26_q19_budget_direction', title: 'Where is the product budget heading?', type: 'single', labels: L.budget }\n      ] },\n      { num: '03', title: 'Building with AI', questions: [\n        { code: 'Q7', col: 'fpd26_q07_features_today', title: 'Which AI capabilities are in your product today?', type: 'multi', labels: L.features, sort: true, note: 'Multiple answers allowed \\u00b7 % of all respondents' },\n        { code: 'Q8', col: 'fpd26_q08_features_12mo', title: 'And which will you add in the next 12 months?', type: 'multi', labels: L.features, sort: true, note: 'Multiple answers allowed \\u00b7 % of all respondents' },\n        { code: 'Q9', col: 'fpd26_q09_code_authorship', title: 'How is your code written today?', type: 'single', labels: L.authorship, canonical: true },\n        { code: 'Q12', col: 'fpd26_q12_quality', title: 'How has quality changed with AI?', type: 'single', labels: L.quality, canonical: true },\n        { code: 'Q11', col: 'fpd26_q11_ship_volume', title: 'Are you shipping more than before?', type: 'single', labels: L.volume }\n      ] },\n      { num: '04', title: 'Ways of working and speed', questions: [\n        { code: 'Q14', col: 'fpd26_q14_ways_of_working_change', title: 'How much have your ways of working changed?', type: 'scale', low: 'Not at all', high: 'Completely' },\n        { code: 'Q15', col: 'fpd26_q15_idea_to_user', title: 'How long from idea to user?', type: 'single', labels: L.idea },\n        { code: 'Q16', col: 'fpd26_q16_speed_vs_last_year', title: 'Speed compared to last year', type: 'single', labels: L.speed },\n        { code: 'Q17', col: 'fpd26_q17_bottlenecks', title: 'What is slowing things down?', type: 'multi', labels: L.bottleneck, sort: true, note: 'Multiple answers allowed \\u00b7 % of all respondents' }\n      ] }\n    ];\n  }\n\n  aggregate(q, rows, n, showCounts, hideEmpty) {\n    const counts = {};\n    let sum = 0, answered = 0;\n    rows.forEach(r => {\n      const raw = (r[q.col] || '').trim();\n      if (!raw) return;\n      const decoded = raw.replace(/&#xa0;|&nbsp;/g, ' ');\n      const vals = (q.type === 'multi' ? decoded.split(';') : [decoded]).map(v => this.clean(v, q.role));\n      vals.forEach(v => { if (v) counts[v] = (counts[v] || 0) + 1; });\n      if (q.type === 'scale') { const num = parseInt(raw, 10); if (!isNaN(num)) { sum += num; answered++; } }\n    });\n    let keys;\n    if (q.type === 'scale') keys = ['1', '2', '3', '4', '5'];\n    else {\n      keys = Object.keys(q.labels);\n      Object.keys(counts).forEach(k => { if (!keys.includes(k)) keys.push(k); });\n    }\n    if (hideEmpty) keys = keys.filter(k => counts[k]);\n    let opts = keys.map(k => {\n      const c = counts[k] || 0;\n      const pct = n ? Math.round((c / n) * 100) : 0;\n      let label = k;\n      if (q.type === 'scale') {\n        if (k === '1') label = '1 \\u00b7 ' + q.low;\n        else if (k === '5') label = '5 \\u00b7 ' + q.high;\n      } else label = q.labels[k] || k.replace(/_/g, ' ').replace(/^./, ch => ch.toUpperCase());\n      return { key: k, label, count: c, pct };\n    });\n    if (q.sort && q.type !== 'scale') opts.sort((a, b) => b.count - a.count);\n    const max = Math.max(0, ...opts.map(o => o.count));\n    opts = opts.map(o => ({\n      label: o.label,\n      value: showCounts ? o.pct + '% \\u00b7 ' + o.count : o.pct + '%',\n      w: Math.max(o.pct, o.count > 0 ? 2 : 0),\n      fill: o.count === max && max > 0 ? '#1CCE70' : '#0A0A0A',\n      weight: o.count === max && max > 0 ? 700 : 400\n    }));\n    return {\n      code: q.code, title: q.title, options: opts,\n      note: q.note || (q.type === 'scale' ? 'Rated on a scale from 1 (' + q.low.toLowerCase() + ') to 5 (' + q.high.toLowerCase() + ')' : false),\n      avg: q.type === 'scale' && answered ? (sum / answered).toFixed(1) : false\n    };\n  }\n\n  renderVals() {\n    const rows = this.state.rows;\n    const showCounts = this.props.showCounts ?? false;\n    const hideEmpty = this.props.hideEmpty ?? false;\n    const cupIcon = React.createElement('canvas', { ref: this.cupRef, width: 192, height: 192, style: { width: '38px', height: '38px', flex: 'none' }, 'aria-hidden': 'true' });\n    if (!rows) return { n: '\\u2026', sections: [], cupIcon };\n    const n = rows.length;\n    const sections = this.defs().map(sec => ({\n      num: sec.num, title: sec.title,\n      questions: sec.questions.map(q => this.aggregate(q, rows, n, showCounts, hideEmpty))\n    }));\n    return { n, sections, cupIcon };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
